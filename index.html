<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SKT Takip</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --zemin: var(--tg-theme-bg-color, #ffffff);
    --kart: var(--tg-theme-secondary-bg-color, #f4f4f2);
    --yazi: var(--tg-theme-text-color, #1f1f1d);
    --soluk: var(--tg-theme-hint-color, #78786f);
    --vurgu: var(--tg-theme-button-color, #2f6fd0);
    --vurgu-yazi: var(--tg-theme-button-text-color, #ffffff);
    --cizgi: color-mix(in srgb, var(--soluk) 30%, transparent);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 12px 14px 28px;
    font: 16px/1.45 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: var(--zemin); color: var(--yazi);
  }
  .sekmeler { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
  .sekme {
    flex: 1 1 30%; padding: 11px 4px; border-radius: 10px; font-size: 13px; font-weight: 600;
    background: var(--kart); color: var(--soluk); border: 1px solid var(--cizgi);
    text-align: center; cursor: pointer;
  }
  .sekme.secili { background: var(--vurgu); color: var(--vurgu-yazi); border-color: transparent; }
  label { display: block; font-size: 13px; color: var(--soluk); margin: 0 0 6px; }
  .alan { margin-bottom: 14px; }
  input {
    width: 100%; padding: 13px 14px; font-size: 17px; color: var(--yazi);
    background: var(--kart); border: 1px solid var(--cizgi); border-radius: 12px;
  }
  input:focus { outline: 2px solid var(--vurgu); outline-offset: -1px; }
  button { font: inherit; cursor: pointer; border: 0; }
  .btn {
    width: 100%; padding: 15px; border-radius: 12px; font-size: 17px; font-weight: 600;
    background: var(--vurgu); color: var(--vurgu-yazi);
  }
  .btn-ikincil { background: var(--kart); color: var(--yazi); border: 1px solid var(--cizgi); }
  .cipler { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .cip {
    padding: 9px 15px; border-radius: 999px; background: var(--kart);
    border: 1px solid var(--cizgi); color: var(--yazi); font-size: 15px;
  }
  .cip.secili { background: var(--vurgu); color: var(--vurgu-yazi); border-color: transparent; }
  #kamera { display: none; margin-bottom: 14px; }
  #kamera.acik { display: block; }
  .video-kutu { position: relative; border-radius: 14px; overflow: hidden; background: #000; aspect-ratio: 4 / 3; }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .nisan {
    position: absolute; left: 8%; right: 8%; top: 32%; height: 36%;
    border: 3px solid rgba(255,255,255,.9); border-radius: 10px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,.35);
  }
  .durum { font-size: 14px; color: var(--soluk); margin-top: 8px; text-align: center; }
  .uyari { background: color-mix(in srgb, #e24b4a 12%, transparent); color: #a32d2d;
           padding: 11px 13px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .bilgi { font-size: 13px; color: var(--soluk); margin: -6px 0 14px; }
  .gecmis { margin-top: 24px; border-top: 1px solid var(--cizgi); padding-top: 12px; }
  .gecmis h2 { font-size: 13px; color: var(--soluk); font-weight: 500; margin: 0 0 8px; }
  .kayit { font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--cizgi); }
  .gizli { display: none !important; }
</style>
</head>
<body>

<div class="sekmeler">
  <div class="sekme secili" data-sekme="kart">Ürün kartı</div>
  <div class="sekme" data-sekme="sayim">Sayım</div>
  <div class="sekme" data-sekme="urun_ekle">Ürün ekle</div>
  <div class="sekme" data-sekme="skt_ekle">SKT ekle</div>
  <div class="sekme" data-sekme="fire">Kaldırma</div>
  <div class="sekme" data-sekme="skt_sil">SKT sil</div>
</div>

<div id="uyari" class="uyari gizli"></div>

<div id="taraButonlari" style="display:flex; gap:8px; margin-bottom:14px">
  <button id="tara" class="btn btn-ikincil" style="flex:1">📷 Kamerayla okut</button>
  <button id="fotoButon" class="btn btn-ikincil" style="flex:1">🖼 Fotoğrafla okut</button>
</div>
<input type="file" id="fotoSec" accept="image/*" capture="environment" hidden>
<div class="durum gizli" id="fotoDurum" style="margin:-6px 0 12px"></div>

<div id="kamera">
  <div class="video-kutu">
    <video id="video" playsinline muted></video>
    <div class="nisan"></div>
  </div>
  <div class="durum" id="kameraDurum">Barkodu çerçevenin içine al</div>
  <button id="kameraKapat" class="btn btn-ikincil" style="margin-top:10px">Kamerayı kapat</button>
</div>

<div class="alan">
  <label for="kod">Ürün kodu / barkod</label>
  <input id="kod" inputmode="numeric" autocomplete="off" placeholder="0101565">
</div>

<div class="alan">
  <label for="fiyat">Fiyat</label>
  <input id="fiyat" inputmode="decimal" autocomplete="off" placeholder="10,00">
  <div class="bilgi gizli" id="fiyatBilgi">Etiket QR'ından okundu, yanlışsa düzelt.</div>
</div>

<div class="alan gizli" id="alanSkt">
  <label for="skt">Son kullanma tarihi</label>
  <input id="skt" type="date">
</div>

<div class="alan gizli" id="alanAdet">
  <label for="adet" id="adetEtiket">Adet</label>
  <input id="adet" type="number" min="1" step="1" value="1" inputmode="numeric">
  <div class="cipler" id="adetCipleri"></div>
</div>

<div class="bilgi gizli" id="sekmeNotu"></div>

<button id="gonder" class="btn">Kaydet</button>

<div class="gecmis gizli" id="gecmis">
  <h2>Bu oturumda gönderilenler</h2>
  <div id="gecmisListe"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }
const BOT = "SKT67bot";
const $ = (id) => document.getElementById(id);

/* --- sekmeler --- */
const SEKMELER = {
  kart:      { buton: "Ürün kartını getir", skt: false, adet: false,
               not: "Okuttuğun ürünün adı, fiyatı ve kayıtlı SKT'leri sohbete gelir. " +
                    "Adet değiştirme ve yeni SKT ekleme oradaki butonlarla yapılır." },
  sayim:     { buton: "Sayımı gönder",    skt: true,  adet: true,  adetEtiket: "Rafta sayılan adet",
               not: "Kayıttan az sayarsan aradaki fark satıldı olarak düşer. " +
                    "Tarihi boş bırakırsan bot hangi kayıt diye sorar." },
  urun_ekle: { buton: "Ürünü tanımla",    skt: false, adet: false,
               not: "Ürün adını ve SKT'den kaç gün önce kalkacağını bot sohbette soracak." },
  skt_ekle:  { buton: "Kaydet",           skt: true,  adet: true,  adetEtiket: "Adet",
               sktZorunlu: true, not: "" },
  fire:      { buton: "Fire olarak düş",  skt: true,  adet: true,  adetEtiket: "Kaldırılan adet",
               not: "Bu adet fire (çekildi) olarak kaydedilir, satış sayılmaz." },
  skt_sil:   { buton: "Kayıtları getir",  skt: false, adet: false,
               not: "Bu ürünün kayıtları sohbete gelir, silmek istediğinin butonuna basarsın." },
};
let aktifSekme = "skt_ekle";

function sekmeSec(ad) {
  aktifSekme = ad;
  const s = SEKMELER[ad];
  document.querySelectorAll(".sekme").forEach((d) =>
    d.classList.toggle("secili", d.dataset.sekme === ad));
  $("alanSkt").classList.toggle("gizli", !s.skt);
  $("alanAdet").classList.toggle("gizli", !s.adet);
  if (s.adet) $("adetEtiket").textContent = s.adetEtiket;
  // "0" secenegi yalnizca sayimda anlamli ("rafta hic kalmamis")
  const sifir = document.querySelector('.cip[data-deger="0"]');
  if (sifir) sifir.classList.toggle("gizli", ad !== "sayim");
  $("adet").min = ad === "sayim" ? 0 : 1;
  $("gonder").textContent = s.buton;
  $("sekmeNotu").textContent = s.not;
  $("sekmeNotu").classList.toggle("gizli", !s.not);
  uyar("");
}
document.querySelectorAll(".sekme").forEach((d) =>
  d.onclick = () => sekmeSec(d.dataset.sekme));

const uyariKutu = $("uyari");
function uyar(metin) {
  uyariKutu.textContent = metin;
  uyariKutu.classList.toggle("gizli", !metin);
}
function titret(tur) { try { tg && tg.HapticFeedback.notificationOccurred(tur); } catch (e) {} }

/* --- adet cipleri --- */
[0, 1, 2, 3, 4, 5, 6, 8, 10, 12, 24].forEach((s) => {
  const b = document.createElement("button");
  b.className = "cip";
  b.dataset.deger = s;
  b.textContent = s;
  b.onclick = () => { $("adet").value = s; isaretle(s); };
  $("adetCipleri").appendChild(b);
});
function isaretle(deger) {
  document.querySelectorAll(".cip").forEach((c) =>
    c.classList.toggle("secili", Number(c.textContent) === Number(deger)));
}
$("adet").addEventListener("input", () => isaretle($("adet").value));
isaretle(1);
sekmeSec("kart");

/* --- barkod okuma ---
   Android'de tarayicinin yerlesik BarcodeDetector'u var. iPhone'da (WebKit) yok;
   orada ZXing'in cekirdek okuyucusuyla kareleri kendimiz cozuyoruz. ZXing'in
   hazir video yardimcilarini kullanmiyoruz: "oynatilabilir" olayini bekledikleri
   icin video zaten oynuyorsa hic taramaya baslamiyorlardi.
   Adrese ?zxing=1 eklenirse Android/bilgisayarda da iPhone yolu denenir. */
const ZORLA_ZXING = new URLSearchParams(location.search).has("zxing");
let yerelDedektor = null, zxingOkuyucu = null;

function okuyucuHazirla() {
  if (yerelDedektor || zxingOkuyucu) return true;
  if (!ZORLA_ZXING && "BarcodeDetector" in window) {
    yerelDedektor = new BarcodeDetector({
      formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "qr_code", "itf"]
    });
    return true;
  }
  if (window.ZXing && ZXing.MultiFormatReader) {
    const B = ZXing.BarcodeFormat;
    const ipuclari = new Map();
    ipuclari.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,
      [B.QR_CODE, B.EAN_13, B.EAN_8, B.UPC_A, B.UPC_E, B.CODE_128, B.CODE_39, B.ITF]);
    ipuclari.set(ZXing.DecodeHintType.TRY_HARDER, true);
    zxingOkuyucu = new ZXing.MultiFormatReader();
    zxingOkuyucu.setHints(ipuclari);
    return true;
  }
  return false;
}

const tuval = document.createElement("canvas");
const tuvalKalem = tuval.getContext("2d", { willReadFrequently: true });

/* kaynagin bir bolgesini tuvale cizer; olcek > 1 kucuk kalan kodu buyutur */
function bolgeyiCiz(kaynak, [x, y, w, h], olcek) {
  const hedefGen = Math.max(1, Math.min(1600, Math.round(w * olcek)));
  tuval.width = hedefGen;
  tuval.height = Math.max(1, Math.round(h * hedefGen / w));
  tuvalKalem.drawImage(kaynak, x, y, w, h, 0, 0, tuval.width, tuval.height);
}

async function tuvaliCoz() {
  if (yerelDedektor) {
    try {
      const bulunan = await yerelDedektor.detect(tuval);
      return bulunan.length ? bulunan[0].rawValue : null;
    } catch (e) { return null; }
  }
  try {
    const isik = new ZXing.HTMLCanvasElementLuminanceSource(tuval);
    return zxingOkuyucu.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(isik))).getText();
  } catch (e) {
    return null;                       // bu karede kod yok
  } finally {
    zxingOkuyucu.reset();
  }
}

/* bir goruntuyu sirayla dener: tum kare, nisangah bolgesi, uzaktaki kucuk kod */
async function kaynagiCoz(kaynak, gen, yuk) {
  const denemeler = [
    [[0, 0, gen, yuk], 1],
    [[gen * 0.08, yuk * 0.25, gen * 0.84, yuk * 0.5], 2],
    [[gen * 0.2, yuk * 0.3, gen * 0.6, yuk * 0.4], 2.5],
  ];
  for (const [bolge, olcek] of denemeler) {
    bolgeyiCiz(kaynak, bolge, olcek);
    const sonuc = await tuvaliCoz();
    if (sonuc) return sonuc;
  }
  return null;
}

/* --- canli kamera --- */
let akis = null, tarama = null, cozuluyor = false;

async function kamerayiAc() {
  uyar("");
  if (!okuyucuHazirla()) {
    uyar("Bu cihazda okuma desteklenmiyor. Kodu elle yaz.");
    return;
  }
  $("kamera").classList.add("acik");
  $("taraButonlari").classList.add("gizli");
  try {
    akis = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
  } catch (e) {
    kamerayiKapat();
    uyar("Kamera açılamadı. İzin ver ya da 'Fotoğrafla okut'u kullan.");
    return;
  }
  const video = $("video");
  video.muted = true;
  video.setAttribute("playsinline", "");
  video.srcObject = akis;
  try { await video.play(); } catch (e) {}

  // destekleyen cihazlarda surekli odaklama iste (iPhone bunu kendisi yonetir)
  try {
    const iz = akis.getVideoTracks()[0];
    const yetenek = iz.getCapabilities ? iz.getCapabilities() : {};
    if (yetenek.focusMode && yetenek.focusMode.includes("continuous")) {
      await iz.applyConstraints({ advanced: [{ focusMode: "continuous" }] });
    }
  } catch (e) {}

  $("kameraDurum").textContent = "Kodu çerçeveye al · telefonu 20-30 cm uzakta tut";
  tarama = setInterval(async () => {
    if (cozuluyor || !video.videoWidth) return;
    cozuluyor = true;
    try {
      const sonuc = await kaynagiCoz(video, video.videoWidth, video.videoHeight);
      if (sonuc) okundu(sonuc);
    } finally {
      cozuluyor = false;
    }
  }, 250);
}

function kamerayiKapat() {
  if (tarama) { clearInterval(tarama); tarama = null; }
  if (akis) { akis.getTracks().forEach((t) => t.stop()); akis = null; }
  $("video").srcObject = null;
  $("kamera").classList.remove("acik");
  $("taraButonlari").classList.remove("gizli");
}

/* --- fotograftan okuma: telefonun kendi kamerasi netlemeyi daha iyi yapar --- */
function resmiYukle(dosya) {
  return new Promise((coz, reddet) => {
    const adres = URL.createObjectURL(dosya);
    const resim = new Image();
    resim.onload = () => { coz(resim); setTimeout(() => URL.revokeObjectURL(adres), 2000); };
    resim.onerror = reddet;
    resim.src = adres;
  });
}

async function fotografiOku(dosya) {
  uyar("");
  if (!okuyucuHazirla()) { uyar("Bu cihazda okuma desteklenmiyor. Kodu elle yaz."); return; }
  $("fotoDurum").textContent = "Fotoğraf okunuyor…";
  $("fotoDurum").classList.remove("gizli");
  try {
    const resim = await resmiYukle(dosya);
    const sonuc = await kaynagiCoz(resim, resim.naturalWidth, resim.naturalHeight);
    if (sonuc) okundu(sonuc);
    else uyar("Fotoğrafta kod bulunamadı. Kodu ortaya alıp biraz uzaktan, net çek.");
  } catch (e) {
    uyar("Fotoğraf açılamadı.");
  } finally {
    $("fotoDurum").classList.add("gizli");
  }
}

/* Raf etiketi QR'i "urun kodu - fiyat" tasir: 1713865-10,00 */
function etiketCoz(ham) {
  const e = String(ham).trim().match(/^(\d{4,14})\s*[-_/]\s*(\d{1,6}[.,]\d{2})$/);
  return e ? { kod: e[1], fiyat: e[2] } : { kod: String(ham).trim(), fiyat: null };
}

function okundu(ham) {
  const { kod, fiyat } = etiketCoz(ham);
  $("kod").value = kod;
  $("kameraDurum").textContent = "Okundu: " + kod;
  if (fiyat) {
    $("fiyat").value = fiyat;
    $("fiyatBilgi").classList.remove("gizli");
  }
  titret("success");
  kamerayiKapat();
  // urun kartinda ayrica tusa basmaya gerek yok
  if (aktifSekme === "kart") setTimeout(gonderimYap, 400);
}

$("tara").onclick = kamerayiAc;
$("kameraKapat").onclick = kamerayiKapat;
$("fotoButon").onclick = () => $("fotoSec").click();
$("fotoSec").addEventListener("change", (olay) => {
  const dosya = olay.target.files && olay.target.files[0];
  olay.target.value = "";                // ayni fotograf tekrar secilebilsin
  if (dosya) fotografiOku(dosya);
});

/* --- gonderme ---
   Telegram sendData'ya yalnizca klavye butonundan acilan uygulamada izin verir.
   Tarayicidan ya da mesaj butonundan acilinca t.me baglantisi kullanilir. */
function b64url(metin) {
  return btoa(unescape(encodeURIComponent(metin)))
    .replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}

function paketle(islem, kod, skt, adet, fiyat) {
  const harf = { kart: "k", skt_ekle: "e", sayim: "s", fire: "f",
                 urun_ekle: "u", skt_sil: "d" }[islem];
  const s = SEKMELER[islem];
  return harf + "|" + kod + "|" + (s.skt ? skt : "") + "|" +
         (s.adet ? adet : "") + "|" + (fiyat || "");
}

function gonderimYap() {
  const s = SEKMELER[aktifSekme];
  const kod = $("kod").value.trim();
  const fiyat = $("fiyat").value.trim();
  const skt = $("skt").value;
  const adet = parseInt($("adet").value, 10);

  if (!kod) { uyar("Ürün kodu boş. Kameraya okut ya da elle yaz."); return; }
  if (s.sktZorunlu && !skt) { uyar("Son kullanma tarihini seç."); return; }
  // sayimda 0 gecerli: "rafta hic kalmamis" demek
  const enAz = aktifSekme === "sayim" ? 0 : 1;
  if (s.adet && (Number.isNaN(adet) || adet < enAz)) {
    uyar(enAz === 0 ? "Adet 0 ya da daha fazla olmalı." : "Adet en az 1 olmalı.");
    return;
  }
  uyar("");

  const derin = "https://t.me/" + BOT + "?start=" +
                b64url(paketle(aktifSekme, kod, skt, adet, fiyat));
  gecmiseEkle(kod, derin);
  titret("success");

  if (tg && tg.sendData) {
    try {
      tg.sendData(JSON.stringify({
        islem: aktifSekme, kod: kod, skt: skt || null,
        adet: s.adet ? adet : 1, fiyat: fiyat || null
      }));
    } catch (e) {}
  }
  setTimeout(() => {
    if (document.visibilityState !== "visible") return;
    if (tg && tg.openTelegramLink) tg.openTelegramLink(derin);
    else window.location.href = derin;
  }, 800);

  $("kod").value = "";
  $("fiyat").value = "";
  $("fiyatBilgi").classList.add("gizli");
  $("adet").value = 1;
  isaretle(1);
}

$("gonder").onclick = gonderimYap;

function gecmiseEkle(kod, derin) {
  const kutu = $("gecmisListe");
  const satir = document.createElement("div");
  satir.className = "kayit";
  satir.innerHTML = "<b>" + kod + "</b> · " + SEKMELER[aktifSekme].buton +
    ' <a href="' + derin + '" style="color:var(--vurgu)">→ Telegram</a>';
  kutu.prepend(satir);
  $("gecmis").classList.remove("gizli");
}
</script>
</body>
</html>
